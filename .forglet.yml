name: forglet
template: go

module: github.com/forgant-foundry/forglet
require:
  github.com/forgant-foundry/eventing: v1.0.0
  github.com/spf13/cobra: v1.8.0
  gopkg.in/yaml.v3: v3.0.1

git: true
gitignore:
  - /forglet

license:
  id: MIT
  author: Forgant

github:
  ci: true
  delivery:
    kind: binary
    main: ./cmd/forglet
    versionVar: github.com/forgant-foundry/forglet/cmd/forglet/commands.Version
