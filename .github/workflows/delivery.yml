# ~~ Generated by forglet. To modify, edit .forglet.yml and run 'forglet synth' ~~
jobs:
    delivery:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            - name: Download dependencies
              run: go mod download
            - name: Configure git identity
              run: |-
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git config user.name "github-actions[bot]"
            - name: Install vergant
              run: go install github.com/forgant-foundry/vergant/cmd/vergant@latest
            - id: version
              name: Apply version
              run: echo "tag=$(vergant new)" >> $GITHUB_OUTPUT
            - if: startsWith(steps.version.outputs.tag, 'r')
              name: Build release binaries
              run: |-
                VERSION="${{ steps.version.outputs.tag }}"
                SEM="${VERSION#r}"
                LDFLAGS="-s -w"
                mkdir -p dist

                GOOS=linux  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/forglet .
                tar czf "dist/forglet_${SEM}_linux_amd64.tar.gz" -C /tmp forglet

                GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/forglet .
                tar czf "dist/forglet_${SEM}_darwin_amd64.tar.gz" -C /tmp forglet

                GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o /tmp/forglet .
                tar czf "dist/forglet_${SEM}_darwin_arm64.tar.gz" -C /tmp forglet

                GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o /tmp/forglet.exe .
                cd /tmp && zip "${GITHUB_WORKSPACE}/dist/forglet_${SEM}_windows_amd64.zip" forglet.exe && cd -

                cd dist && sha256sum *.tar.gz *.zip > "forglet_${SEM}_checksums.txt"
            - env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: startsWith(steps.version.outputs.tag, 'r')
              name: Create release
              run: |-
                VERSION="${{ steps.version.outputs.tag }}"
                gh release create "$VERSION" --title "${VERSION#r}" --generate-notes dist/*
name: delivery
"on":
    push:
        branches:
            - '**'
