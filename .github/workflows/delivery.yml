jobs:
    delivery:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            - name: Download dependencies
              run: go mod download
            - name: Configure git identity
              run: |-
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git config user.name "github-actions[bot]"
            - name: Install vergant
              run: go install github.com/forgant-foundry/vergant/cmd/vergant@latest
            - id: version
              name: Apply version
              run: echo "tag=$(vergant new)" >> $GITHUB_OUTPUT
            - env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: startsWith(steps.version.outputs.tag, 'r')
              name: Create release
              run: |-
                VERSION="${{ steps.version.outputs.tag }}"
                gh release create "$VERSION" --title "${VERSION#r}" --generate-notes
name: delivery
"on":
    push:
        branches:
            - '**'
